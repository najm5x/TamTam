name: "tamtam"
description: "A new Flutter project."
publish_to: "none"
version: "1.0.0+1"
environment:
  sdk: "^3.12.2"
dependencies:
  flutter:
    sdk: "flutter"
  cupertino_icons: "^1.0.8"
  shared_preferences: "^2.5.5"
dev_dependencies:
  flutter_test:
    sdk: "flutter"
  flutter_lints: "^6.0.0"
flutter:
  uses-material-design: true
  assets:
    - "assets/"
    - "assets/fonts/"
    - "assets/routes/"
    - "assets/home/"
    - "assets/setup/"
    - "assets/dialogs/"
    - "assets/victory/"
    - "assets/branding/"
    - "assets/shared/profiles/"
    - "assets/skins/boards/"
    - "assets/skins/frames/"
    - "assets/skins/pieces/"
    - "assets/skins/cast_trays/"
    - "assets/skins/cubes/"
  fonts:
    - family: "Plus Jakarta Sans"
      fonts:
        - asset: "assets/fonts/Plus Jakarta Sans.ttf"
